<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Qal'a O'yini V2</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one column on phones (village scrolls sideways), two columns on PC (village left, panels right). Single committed night-violet game look, like the vocab games. */
:root{
  --ground:#140D33;          /* page: deep ink violet, same family as the arcade's ink */
  --ground-2:#1E1548;
  --glass:rgba(255,255,255,.08);
  --glass-2:rgba(255,255,255,.14);
  --line:rgba(255,255,255,.12);
  --fg:#FFFFFF;
  --sub:rgba(255,255,255,.66);
  --gold:#F5B700; --gold-ink:#2B1700;
  --crystal:#B99BFF; --crystal-deep:#6A3DF0;
  --ok:#138A3D; --ok-text:#5BE08A;   /* green: done / correct only */
  --err:#E5483C;                    /* badge dot only */
  --display:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1180px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:900}
h2{font-size:19px;font-weight:900}
h3{font-size:16px;font-weight:800}
p{margin:0}
.sub{color:var(--sub)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--crystal);outline-offset:2px;border-radius:12px}
button:disabled{cursor:not-allowed;opacity:.45}
svg.i{width:18px;height:18px;flex:none;vertical-align:-4px}

/* top bar */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.top>h1{grid-area:1/1}
#sndBtn{grid-area:1/2}
.res{grid-area:2/1/3/3;display:grid;grid-template-columns:minmax(0,1.8fr) repeat(3,minmax(0,1fr));gap:6px}
.chip{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--glass);border-radius:999px;padding:7px 10px;font-weight:800;font-family:var(--display);min-width:0;white-space:nowrap}
.chip .bar{width:54px;display:none}
@media (min-width:560px){.chip .bar{display:block}}
@media (max-width:420px){.chip{font-size:14px;padding:6px 6px;gap:4px}.chip svg.i{width:16px!important;height:16px!important}.chip .cap{display:none}}
@media (min-width:900px){.top{grid-template-columns:auto minmax(0,1fr) auto}.res{grid-area:1/2;display:flex;justify-content:flex-end}#sndBtn{grid-area:1/3}}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--glass);display:grid;place-items:center}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--gold);transition:width .3s}
.bar.big{height:12px}
.bar.cr>i{background:var(--crystal)}
.bar.ok>i{background:var(--ok-text)}

.seg{display:flex;background:var(--glass);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;min-width:0;padding:9px 4px;border-radius:999px;font-weight:800;font-family:var(--display);font-size:14px;line-height:1.2;color:var(--sub);overflow-wrap:anywhere}
@media (max-width:420px){.seg button{font-size:12.5px;padding:9px 2px}}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ground)}

.lock{display:flex;gap:10px;align-items:center;background:#fff;color:var(--ground);border-radius:20px;padding:12px 14px}
.lock b{font-family:var(--display)}
.lock .dot{width:10px;height:10px;border-radius:50%;background:var(--err);flex:none}

.layout{display:grid;gap:14px}
@media (min-width:1000px){.layout{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}

/* village */
.scene{border-radius:24px;overflow-x:auto;overflow-y:hidden;background:#7FC3FF;scrollbar-width:thin;position:relative}
.scene canvas{display:block}
.hint{font-size:12px;color:var(--sub);text-align:center}
@media (min-width:760px){.hint{display:none}}

.card{background:var(--glass);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.blist{display:grid;gap:10px}
@media (min-width:560px){.blist{grid-template-columns:1fr 1fr}}
.bcard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--glass);border-radius:20px;padding:10px 12px 10px 10px;min-width:0}
.bcard:hover{background:var(--glass-2)}
.bcard img{width:64px;height:56px;object-fit:contain;flex:none;border-radius:12px;background:rgba(255,255,255,.06)}
.bcard .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.bcard .row1,.row1{display:flex;justify-content:space-between;gap:4px 6px;align-items:center;flex-wrap:wrap;min-width:0}
.row1 h3{min-width:0;overflow-wrap:anywhere}
.pill{font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px;background:var(--glass-2);white-space:nowrap;font-family:var(--display)}
.pill.gold{background:var(--gold);color:var(--gold-ink)}
.pill.cr{background:var(--crystal);color:#1A0E45}
.pill.ok{background:var(--ok);color:#fff}
.state{font-size:12.5px;color:var(--sub)}
.state b{color:var(--fg)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 20px;font-weight:900;font-family:var(--display);font-size:16px;background:#fff;color:var(--ground)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.cr{background:var(--crystal);color:#1A0E45}
.btn.soft{background:var(--glass-2);color:var(--fg)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.wide{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(8,4,26,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:760px){.veil{align-items:center}}
.sheet{background:var(--ground-2);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:760px){.sheet{border-radius:28px}}
.sheet .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.cmp figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(255,255,255,.06);border-radius:18px;padding:8px}
.cmp img{width:100%;max-width:200px;height:auto}
.cmp figcaption{font-size:12.5px;font-weight:800;font-family:var(--display)}
.arrow{font-size:22px;color:var(--sub)}
.looks{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.looks figure{margin:0;flex:none;width:78px;text-align:center;font-size:11px;color:var(--sub);border-radius:14px;padding:4px;background:rgba(255,255,255,.04)}
.looks figure.on{background:#fff;color:var(--ground);font-weight:800}
.looks img{width:70px;height:60px;object-fit:contain}
.kv{display:flex;justify-content:space-between;gap:4px 12px;font-size:14px;flex-wrap:wrap}
.kv>b{margin-left:auto;text-align:right;min-width:0;overflow-wrap:anywhere}
.kv span:first-child{color:var(--sub)}
.note{font-size:13px;color:var(--sub);background:rgba(255,255,255,.05);border-radius:14px;padding:10px 12px}

/* troops */
.tcard{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:start}
.tcard img{width:84px;height:84px;border-radius:16px;background:rgba(255,255,255,.06);display:block}
.tcard>button{width:84px}
.roles{display:flex;gap:6px;flex-wrap:wrap}
.count{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.count .btn{margin-left:auto;white-space:nowrap;flex:none}
.count button:not(.btn){width:36px;height:36px;border-radius:50%;background:var(--glass-2);font-weight:900;font-size:20px;font-family:var(--display)}
.count b{min-width:28px;text-align:center;font-family:var(--display);font-size:20px}
.lvls{display:flex;gap:6px}
.lvls img{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.05);opacity:.5}
.lvls img.on{opacity:1;background:#fff}

/* battle */
.bhud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stars{display:flex;gap:4px}
.stars svg{width:26px;height:26px}
.bscene{border-radius:24px;overflow:hidden;align-self:center;width:100%;max-width:440px;background:#5FAE5F}
.bscene canvas{display:block;width:100%;height:auto}
.result{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.result .stars svg{width:44px;height:44px}
.target{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center}
.target img{width:96px;height:66px;border-radius:14px;object-fit:cover;background:#7FC3FF}

/* showcase */
.lvpick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lvpick input{flex:1;min-width:140px;accent-color:#F5B700;height:28px}
.pvname{font-family:var(--display);font-size:17px;min-width:9.5em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{margin:0;background:rgba(255,255,255,.05);border-radius:18px;padding:6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile canvas{width:100%;aspect-ratio:7/6;border-radius:13px;display:block}
.tile figcaption{display:flex;flex-direction:column;gap:2px;padding:0 4px 4px;min-width:0}
.tile figcaption b{font-family:var(--display);font-size:13.5px;overflow-wrap:anywhere}
.tile figcaption span{font-size:12px;color:var(--sub);overflow-wrap:anywhere}
.showhead{display:flex;flex-direction:column;gap:4px}
/* demo panel */
details.demo{background:rgba(255,255,255,.04);border:1px dashed var(--line);border-radius:20px;padding:12px 14px}
details.demo summary{cursor:pointer;font-weight:800;font-family:var(--display)}
details.demo .btns{margin-top:10px}

/* Doni */
.doni{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:flex-end;gap:10px;width:fit-content;max-width:min(460px,calc(100% - 32px));cursor:pointer;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.doni .bub{flex:1;min-width:0}
.doni .bub{background:#fff;color:var(--ground);border-radius:20px 20px 20px 6px;padding:12px 14px;font-weight:700;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.doni .bub small{display:block;color:#6B6585;font-weight:600;margin-top:4px}
.doni svg{width:70px;height:78px;flex:none;animation:bob 1.6s ease-in-out infinite}
@keyframes pop{from{transform:translateY(130%)}to{transform:translateY(0)}}
@keyframes bob{50%{transform:translateY(-4px)}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#fff;color:var(--ground);padding:10px 16px;border-radius:999px;font-weight:800;z-index:70;font-family:var(--display);box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){.doni,.doni svg{animation:none}.bar>i{transition:none}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<script>
"use strict";
/* ═════════ utils ═════════ */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = (n) => Math.round(n).toLocaleString("ru-RU").replace(/ /g, " ");
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function dur(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000)), d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return d ? `${d} kun ${h} soat` : h ? `${h} soat ${m} daq` : m ? `${m} daq ${x} s` : `${x} s`;
}
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const coinI = (s = 16) => `<svg class="i" style="width:${s}px;height:${s}px"><use href="#coin"/></svg>`;
const gemI = (s = 16) => `<svg class="i" style="width:${s}px;height:${s}px"><use href="#gem"/></svg>`;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ═════════ sound (code only) ═════════ */
let AC = null;
function snd(kind) {
  if (!S || !S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime;
    const tone = (f, at, len, type = "sine", vol = 0.12) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t0 + at); g.gain.exponentialRampToValueAtTime(0.001, t0 + at + len); o.connect(g).connect(AC.destination); o.start(t0 + at); o.stop(t0 + at + len + 0.02); };
    if (kind === "coin") { tone(988, 0, 0.08); tone(1319, 0.07, 0.14); }
    else if (kind === "done") { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.22, "triangle")); }
    else if (kind === "tap") tone(660, 0, 0.05, "triangle", 0.06);
    else if (kind === "hit") tone(140 + Math.random() * 40, 0, 0.07, "square", 0.03);
    else if (kind === "win") { [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.12, 0.3, "triangle")); }
    else if (kind === "calm") { tone(330, 0, 0.25, "sine", 0.08); tone(392, 0.18, 0.3, "sine", 0.08); }
    else if (kind === "gem") { tone(1568, 0, 0.1, "sine", 0.09); tone(2093, 0.08, 0.2, "sine", 0.09); }
  } catch (e) {}
}

/* ═════════ rules (would live in the database in the real site) ═════════ */
const MATS = [
  { k: "wood", n: "Yog'och", c: "#A8743F", d: "#6E4524", r: "#D9B45A", t: "#6E4524" },
  { k: "stone", n: "Tosh", c: "#A9B1BC", d: "#6F7884", r: "#4E5A6B", t: "#8B95A3" },
  { k: "brick", n: "G'isht", c: "#C0533A", d: "#7E2F20", r: "#E8913F", t: "#F3D3B5" },
  { k: "iron", n: "Temir", c: "#4B5B7A", d: "#2C3650", r: "#8EA6D4", t: "#D3DCEC" },
  { k: "marble", n: "Marmar", c: "#F2EFE8", d: "#C9C2B3", r: "#1FA39A", t: "#F5B700" },
  { k: "emerald", n: "Zumrad", c: "#1E9E62", d: "#0E5E3A", r: "#F5B700", t: "#BFF5D6" },
  { k: "obsidian", n: "Obsidian", c: "#2A2238", d: "#15101E", r: "#3E2F58", t: "#FF6B2C" },
  { k: "ice", n: "Muz", c: "#A8E6FF", d: "#4FA8D6", r: "#FFFFFF", t: "#E9FBFF" },
  { k: "amethyst", n: "Ametist", c: "#8B5CF6", d: "#5428B8", r: "#FF7AC8", t: "#F3E8FF" },
  { k: "gold", n: "Oltin", c: "#F5C542", d: "#B8860B", r: "#C8102E", t: "#FFF3B0" },
];
const mat = (l) => MATS[clamp(l, 1, 10) - 1];

function drawCastle(c, l, t, o = {}) {

/* ═════════ game logic ═════════ */
function addGold(n, why) {
  const cap = goldCap(S.b.storage), add = Math.max(0, Math.min(n, cap - S.gold));
  S.gold += add; snd("coin");
  toast(add < n ? `${why}: +${add} oltin (ombor to'ldi, ${n - add} sig'madi)` : `${why}: +${add} oltin`);
  save(); render();
}
function freeBuilder() { for (let i = 0; i < S.builders; i++) if (!S.jobs.find((j) => j.bi === i)) return i; return -1; }
function tryStart() {
  let i;
  while (S.wait.length && (i = freeBuilder()) >= 0) { const k = S.wait.shift(); const ms = hours(k, S.b[k]) * 3600e3; S.jobs.push({ k, bi: i, start: S.vt, end: S.vt + ms }); }
  if (!S.tjob && S.twait.length) { const k = S.twait.shift(); S.tjob = { k, start: S.vt, end: S.vt + troopHours(S.tr[k].lv) * 3600e3 }; }
  syncBuilders();
}
function deposit(k, amount) {
  if (locked()) return toast("Qishloq tiklanmoqda. 5 daqiqadan keyin urinib ko'ring.");
  const need = cost(k, S.b[k]) - S.fund[k], n = Math.min(amount, need, S.gold);
  if (n <= 0) return;
  S.gold -= n; S.fund[k] += n; snd("coin");
  if (S.fund[k] >= cost(k, S.b[k])) { S.fund[k] = 0; S.wait.push(k); tryStart(); snd("done"); }
  save(); render(); refreshSheet();
}
function depositTroop(k, amount) {
  if (locked()) return toast("Qishloq tiklanmoqda. 5 daqiqadan keyin urinib ko'ring.");
  const tr = S.tr[k], gem = tr.lv === 2, total = gem ? T[k].c3 : T[k].g2, need = total - tr.fund;
  const n = Math.min(amount, need, gem ? S.cr : S.gold); if (n <= 0) return;
  if (gem) S.cr -= n; else S.gold -= n;
  tr.fund += n; snd(gem ? "gem" : "coin");
  if (tr.fund >= total) { tr.fund = 0; S.twait.push(k); tryStart(); snd("done"); }
  save(); render(); refreshSheet();
}
function tickJobs() {
  let changed = false;
  S.jobs.slice().forEach((j) => { if (S.vt >= j.end) { S.jobs = S.jobs.filter((x) => x !== j); S.b[j.k]++; changed = true; const m = mat(S.b[j.k]); doni("party", `${B[j.k].n} ${S.b[j.k]}-darajaga chiqdi: endi ${m.n.toLowerCase()}dan!`, "Quruvchi kulbasiga qaytmoqda."); } });
  if (S.tjob && S.vt >= S.tjob.end) { const k = S.tjob.k; S.tr[k].lv++; S.tjob = null; changed = true; doni("proud", `${T[k].n} endi ${TLV[S.tr[k].lv - 1].toLowerCase()} askar (${S.tr[k].lv}-daraja).`, "Yangi ko'rinish va kuchliroq zarba."); }
  if (changed) { tryStart(); save(); render(); refreshSheet(); }
}
const armyUsed = () => TKEYS.reduce((a, k) => a + S.army[k] * T[k].sp, 0);

function miniVillage(e) {

  B2.booms.forEach((b) => { const k = b.t / .7; c.globalAlpha = 1 - k; c.fillStyle = b.small ? "#CBC3EC" : "#9A93AE"; for (let i = 0; i < 5; i++) { const a = i * 1.26; c.beginPath(); c.arc(b.x + Math.cos(a) * k * (b.small ? 10 : 22), b.y + Math.sin(a) * k * (b.small ? 8 : 14) - k * 10, (b.small ? 3 : 7) * (1 - k * .5), 0, 7); c.fill(); } c.globalAlpha = 1; });
}
function startAttack(id) {
  newDayCheck();
  const e = CLASSMATES.find((x) => x.id === id);
  if (!e || locked() || S.att.n >= ATTACKS_PER_DAY || !armyUsed()) return;
  S.att.n++; save();
  const lv = Object.fromEntries(TKEYS.map((k) => [k, S.tr[k].lv]));
  BATTLE = { sim: makeBattle(e, S.army, lv, (Date.now() & 0xffffff) ^ id, S.b.barracks), speed: 1, paid: false, acc: 0 };
  render(); window.scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" });
}
function typicalArmy(L) {
  const cap = armyCap(L), a = { sword: 0, archer: 0, brute: 0, bird: 0, giant: 0 }; let used = 0;
  [["giant", L >= 5 ? 1 + Math.floor((L - 5) / 2) : 0], ["brute", L >= 3 ? 2 + Math.floor((L - 3) / 3) : 0], ["bird", L >= 4 ? 2 + Math.floor((L - 4) / 3) : 0]]
    .forEach(([k, n]) => { for (let i = 0; i < n; i++) if (used + T[k].sp <= cap) { a[k]++; used += T[k].sp; } });
  while (used < cap) { const k = a.sword <= a.archer * 2 ? "sword" : "archer"; a[k]++; used++; }
  return a;
}
function startShowBattle() {
  const L = PV.l, e = { id: 0, name: `${L}-daraja namuna`, b: { castle: L, wall: L, tower: L, barracks: L, storage: L }, builders: Math.min(3, 1 + Math.floor(L / 4)), tl: 0 };
  const lv = Object.fromEntries(TKEYS.map((k) => [k, PV.tl]));
  BATTLE = { sim: makeBattle(e, typicalArmy(L), lv, Date.now() & 0xffffff, L), speed: 1, paid: false, acc: 0, show: true };
  render(); window.scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" });
}
function vBattle() {
  const B2 = BATTLE.sim, done = B2.done, st = stars(B2);
  const starRow = (n, big) => `<div class="stars" aria-label="${n} yulduz">${[1, 2, 3].map((i) => `<svg style="color:${i <= n ? "#F5B700" : "rgba(255,255,255,.2)"}${big ? ";width:44px;height:44px" : ""}"><use href="#star" fill="currentColor"/></svg>`).join("")}</div>`;
  if (done) {
    const full = pct(B2) >= 100;
    return `<div class="card result"><h2>${st ? "G'alaba!" : "Bu safar yetmadi"}</h2>${starRow(st, true)}
      <p><b class="num">${pct(B2)}%</b> bosib olindi · ${esc(B2.e.name)}</p>
      ${BATTLE.show ? `<p class="sub">Bu namuna jang: hujum sanalmadi, kristall berilmadi.</p>` : st ? `<p style="display:flex;align-items:center;gap:6px;font-weight:800;font-family:var(--display);font-size:18px">${gemI(22)} +${st} kristall</p>` : `<p class="sub">Kristall yo'q, lekin hech narsa yo'qotmadingiz. Askarlaringiz sog'-salomat qaytdi.</p>`}
      <p class="small sub">Hech narsa o'g'irlanmaydi.${full ? ` ${esc(B2.e.name)}ning qishlog'i endi 5 daqiqa tiklanadi.` : ""}</p>
      <p class="small sub">1 yulduz: 50% · 2 yulduz: qal'a buzilsa · 3 yulduz: 100%</p>
      <button class="btn wide" data-bend="1">${BATTLE.show ? "Ko'rinishlarga qaytish" : "Qishloqqa qaytish"}</button></div>`;
  }
  return `<div class="card"><div class="bhud"><div><h3>${esc(B2.e.name)}ning qishlog'i</h3><span class="small sub"><span data-live="bt">0</span> s · <b data-live="bp">0%</b> bosib olindi</span></div><div data-live="bs">${starRow(0)}</div></div></div>
    <div class="bscene" style="margin-top:12px"><canvas id="bc" aria-label="Jang"></canvas></div>
    <div class="btns" style="justify-content:center;margin-top:12px"><button class="btn soft sm" data-bspeed="1">${BATTLE.speed === 1 ? "Tezlashtirish ×2" : "Oddiy tezlik"}</button><button class="btn soft sm" data-bstop="1">Jangni tugatish</button></div>
    <p class="small sub" style="text-align:center;margin-top:8px">Askarlar o'zi boradi: avval kulbalar, keyin devor, minoralar va qal'a. Uchuvchilar devordan oshib o'tadi.</p>`;
}
let bctx = null;
function mountBattle() {
  const cv = $("#bc"); if (!cv) { bctx = null; return; }
  const dpr = Math.min(2, devicePixelRatio || 1); cv.width = BW * dpr; cv.height = BH * dpr; bctx = cv.getContext("2d"); bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function finishBattle() {
  const B2 = BATTLE.sim; if (BATTLE.paid) return; BATTLE.paid = true;
  const st = stars(B2);
  if (BATTLE.show) { snd(st ? "win" : "calm"); return; }
  if (st) { S.cr += st; snd("win"); } else snd("calm");
  if (pct(B2) >= 100) S.rec[B2.e.id] = Date.now() + RECOVER_MS;
  if (st === 3 && !S.seen.star3) { S.seen.star3 = 1; setTimeout(() => doni("proud", `Uch yulduz! ${B2.e.name}ning hamma binosini buzdingiz.`, `+3 kristall. 2-quruvchi ${BUILDER_PRICE[2]} kristall turadi.`), 600); }
  else if (!st) setTimeout(() => doni("calm", "Minoralar kuchli chiqdi.", "Buqa avval minoraga boradi, Gigant devorni tez buzadi. Qo'shinni almashtirib ko'ring."), 500);
  save();
}

/* ═════════ Doni (same mascot as the vocab games) ═════════ */
let doniQ = [], doniOn = false, doniLast = 0;
function doni(mood, text, small) { doniQ.push({ mood, text, small }); if (!doniOn) nextDoni(); }
function nextDoni() {
  const d = doniQ.shift(); if (!d) { doniOn = false; $("#doniHost").innerHTML = ""; return; }
  doniOn = true; snd(d.mood === "calm" ? "calm" : "done");
  const mouth = d.mood === "calm" ? `<path d="M30 52 q5 3 10 0" stroke="#1C1C1E" stroke-width="2.6" fill="none" stroke-linecap="round"/>` : `<path d="M28 50 q7 9 14 0" stroke="#1C1C1E" stroke-width="2.6" fill="#E5483C" stroke-linecap="round"/>`;
  const leaves = Math.min(3, 1 + Math.floor((S.b.castle - 1) / 3));
  $("#doniHost").innerHTML = `<div class="doni" role="status" data-doni="1"><svg viewBox="0 0 70 78" aria-hidden="true">
      <path d="M35 22 q2 -8 0 -14" stroke="#2FA35A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="42" cy="9" rx="7" ry="3.5" fill="#3CC46A" transform="rotate(-25 42 9)"/>${leaves > 1 ? `<ellipse cx="28" cy="11" rx="6.5" ry="3.2" fill="#3CC46A" transform="rotate(25 28 11)"/>` : ""}${leaves > 2 ? `<ellipse cx="35" cy="4" rx="5" ry="2.6" fill="#3CC46A"/>` : ""}
      <circle cx="35" cy="46" r="26" fill="#fff"/><ellipse cx="21" cy="50" rx="5" ry="3" fill="#FF9EC0"/><ellipse cx="49" cy="50" rx="5" ry="3" fill="#FF9EC0"/>
      <circle cx="27" cy="43" r="3" fill="#1C1C1E"/><circle cx="43" cy="43" r="3" fill="#1C1C1E"/>${mouth}</svg>
    <div class="bub">${esc(d.text)}${d.small ? `<small>${esc(d.small)}</small>` : ""}</div></div>`;
  clearTimeout(nextDoni.tm); nextDoni.tm = setTimeout(nextDoni, 5200);
}
function toast(t) { $("#toastHost").innerHTML = `<div class="toast" role="status">${esc(t)}</div>`; clearTimeout(toast.tm); toast.tm = setTimeout(() => ($("#toastHost").innerHTML = ""), 2600); }

/* ═════════ events ═════════ */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-pv],[data-ptl],[data-pbattle],[data-tab],[data-open],[data-close],[data-pay],[data-payhalf],[data-topen],[data-tpay],[data-army],[data-attack],[data-bend],[data-bspeed],[data-bstop],[data-buy],[data-demo],[data-speed],[data-doni]");
  if (!el) return;
  const d = el.dataset;
  if (d.close && (e.target === el || el.tagName === "BUTTON")) return closeSheet();
  if (d.close) return;
  if (d.doni) { clearTimeout(nextDoni.tm); return nextDoni(); }
  snd("tap");
  if (d.tab) { if (BATTLE) return; S.tab = d.tab; save(); render(); if (d.tab === "show") window.scrollTo({ top: 0 }); }
  else if (d.pv) setPV(PV.l + Number(d.pv));
  else if (d.ptl) { PV.tl = Number(d.ptl); document.querySelectorAll("#ptl button").forEach((b) => b.setAttribute("aria-pressed", String(b === el))); }
  else if (d.pbattle) startShowBattle();
  else if (d.open) openSheet(d.open);
  else if (d.pay) deposit(d.pay, S.gold);
  else if (d.payhalf) deposit(d.payhalf, Math.max(1, Math.floor(S.gold / 2)));
  else if (d.topen) openTroop(d.topen);
  else if (d.tpay) depositTroop(d.tpay, Infinity);
  else if (d.army) { const [k, n] = d.army.split("|"); const nv = S.army[k] + Number(n); if (nv < 0 || armyUsed() + Number(n) * T[k].sp > armyCap(S.b.barracks)) return; S.army[k] = nv; save(); render(); }
  else if (d.attack) startAttack(Number(d.attack));
  else if (d.bspeed) { BATTLE.speed = BATTLE.speed === 1 ? 2 : 1; el.textContent = BATTLE.speed === 1 ? "Tezlashtirish ×2" : "Oddiy tezlik"; }
  else if (d.bstop) { BATTLE.sim.done = true; finishBattle(); render(); }
  else if (d.bend) { const back = BATTLE.show ? "show" : "battle"; BATTLE = null; S.tab = back; render(); }
  else if (d.buy) { const p = BUILDER_PRICE[S.builders + 1]; if (!p || S.cr < p || locked()) return; S.cr -= p; S.builders++; snd("gem"); syncBuilders(); tryStart(); save(); render(); doni("party", `${S.builders}-quruvchi keldi! Endi ${S.builders} ta binoni bir vaqtda qurish mumkin.`, "Uning kulbasi devor tashqarisida, birinchi to'siq bo'ladi."); }
  else if (d.speed) { S.speed = Number(d.speed); document.querySelectorAll("#speedSeg button").forEach((b) => b.setAttribute("aria-pressed", String(b === el))); save(); }
  else if (d.demo) {
    const k = d.demo;
    if (k === "hw") addGold(120, "Uy vazifasi tugadi");
    if (k === "cw") addGold(120, "Sinf ishi tugadi");
    if (k === "vg") addGold(25, "Lug'at o'yini");
    if (k === "cr") { S.cr += 10; snd("gem"); save(); render(); }
    if (k === "raided") { S.lock = Date.now() + RECOVER_MS; save(); render(); refreshSheet(); toast("Kimdir qishlog'ingizni 100% bosib oldi. 5 daqiqa tiklanadi."); }
    if (k === "unlock") { S.lock = 0; save(); render(); refreshSheet(); }
    if (k === "day") { S.att = { day: todayStr(), n: 0 }; S.rec = {}; save(); render(); }
    if (k === "reset") { const snd0 = S.sound; S = fresh(); S.sound = snd0; builders.length = 0; BATTLE = null; closeSheet(); syncBuilders(); save(); render(); }
  }
});
$("#sndBtn").addEventListener("click", () => { S.sound = !S.sound; save(); renderRes(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && SHEET) closeSheet(); });
addEventListener("resize", () => { VSCROLL = null; PV.scroll = null; if (BATTLE) return; if (vc && S.tab === "village") sizeVillage(); if (S.tab === "show") mountShow(); });

/* ═════════ main loop ═════════ */
let lastT = performance.now(), liveAcc = 0;
function loop(now) {
  const dt = Math.min(.1, (now - lastT) / 1000); lastT = now;
  const real = Date.now(); S.vt += (real - lastReal) * S.speed; lastReal = real;
  tickJobs(); stepBuilders(dt);
  const t = REDUCED ? 0 : now / 1000;
  if (!BATTLE && S.tab === "village" && vctx && document.body.contains(vc)) drawVillage(t, { c: vctx, b: S.b, nb: S.builders, bl: builders, fill: S.gold / goldCap(S.b.storage), badges: true, main: true });
  if (!BATTLE && S.tab === "show" && PV.c) { stepPreviewBuilders(dt); const L = PV.l; drawVillage(t, { c: PV.c, b: { castle: L, wall: L, tower: L, barracks: L, storage: L }, nb: 3, bl: pbuilders, fill: .8 }); PV.tiles.forEach((o) => o.vis && drawTile(o, t)); }
  if (BATTLE && bctx) {
    const B2 = BATTLE.sim;
    if (!B2.done) { BATTLE.acc += dt * BATTLE.speed; while (BATTLE.acc >= 1 / 30 && !B2.done) { stepBattle(B2, 1 / 30); BATTLE.acc -= 1 / 30; } }
    drawBattle(bctx, B2, now / 1000);
    if (B2.done && !BATTLE.paid) { finishBattle(); setTimeout(render, 700); }
  }
  liveAcc += dt; if (liveAcc > .25) { liveAcc = 0; live(); }
  requestAnimationFrame(loop);
}
function live() {
  document.querySelectorAll("[data-live]").forEach((el) => {
    const k = el.dataset.live;
    if (k === "lock") { el.textContent = dur(S.lock - Date.now()); if (!locked()) render(); }
    else if (k.startsWith("job:") || k.startsWith("jobbar:")) { const j = S.jobs.find((x) => x.k === k.split(":")[1]); if (!j) return; if (k.startsWith("job:")) el.textContent = dur(j.end - S.vt); else el.style.width = clamp(100 * (S.vt - j.start) / (j.end - j.start), 0, 100) + "%"; }
    else if (k === "tjob" && S.tjob) el.textContent = dur(S.tjob.end - S.vt);
    else if (k === "tjobbar" && S.tjob) el.style.width = clamp(100 * (S.vt - S.tjob.start) / (S.tjob.end - S.tjob.start), 0, 100) + "%";
    else if (k.startsWith("rec:")) { const u = S.rec[k.split(":")[1]] || 0; el.textContent = dur(u - Date.now()); if (u <= Date.now()) render(); }
    else if (BATTLE && k === "bt") el.textContent = Math.floor(BATTLE.sim.t);
    else if (BATTLE && k === "bp") el.textContent = pct(BATTLE.sim) + "%";
    else if (BATTLE && k === "bs") { const n = stars(BATTLE.sim); if (el.dataset.n !== String(n)) { el.dataset.n = n; el.innerHTML = `<div class="stars">${[1, 2, 3].map((i) => `<svg style="color:${i <= n ? "#F5B700" : "rgba(255,255,255,.2)"}"><use href="#star" fill="currentColor"/></svg>`).join("")}</div>`; } }
  });
}

/* boot */
document.querySelectorAll("#speedSeg button").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.speed) === S.speed)));
syncBuilders(); builders.forEach((b, i) => { const j = S.jobs.find((x) => x.bi === i); if (j) { const d = doorOf(j.k); b.x = d.x; b.y = d.y; b.path = []; } });
tryStart(); render(); requestAnimationFrame(loop);
if (!S.seen.hello) { S.seen.hello = 1; save(); setTimeout(() => doni("happy", "Bu sizning qishlog'ingiz. Binoga bosib, oltinni bo'lib-bo'lib soling.", "To'lov 100% bo'lganda quruvchi borib quradi."), 900); }
</script>
