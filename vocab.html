}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--font);margin:0;-webkit-tap-highlight-color:transparent}

.sub{color:var(--sub)} .small{font-size:13px}

.balloons{display:flex;justify-content:center;gap:10px;height:70px;align-items:flex-end}
.bl{width:30px;height:38px;border-radius:50% 50% 48% 48%;position:relative;transition:transform .3s,opacity .3s}
.bl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:24px;background:var(--sub)}
.bl.pop{transform:scale(1.6);opacity:0}
.bar2{display:flex;gap:8px;align-items:center}
.bar2 .prog{flex:1;height:12px}
.lb{display:flex;flex-direction:column;gap:6px}
.lb .it{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:9px 12px;transition:transform .3s}
.lb .it.me{background:var(--hw-s)}
.code{font-size:44px;font-weight:800;letter-spacing:.15em;text-align:center;font-variant-numeric:tabular-nums}
.names{display:flex;flex-wrap:wrap;gap:6px}
.boss{position:relative;height:200px;background:linear-gradient(#bfe6ff,#e8f6ff 70%,#7cc77f 70%);border-radius:20px;overflow:hidden}
.boss .castle{position:absolute;left:8px;bottom:22px;width:54px;height:80px}
.boss .en{position:absolute;bottom:26px;width:26px;height:34px;transition:left .1s linear}
.hp{position:absolute;left:10px;top:10px;display:flex;gap:3px}
.hp i{width:16px;height:6px;border-radius:3px;background:var(--rv)} .hp i.off{background:#0003}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;max-width:90vw;text-align:center}
.note{background:var(--wr-s);color:var(--wr);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
"use strict";
/* ---------- demo words (real site: words from each week's classwork and homework) ---------- */
let GROUPS = [];
const RANDOM = {id:"rand", week:"Oxirgi oy", name:"Tasodifiy so'zlar", words:null};
const CLASSMATES = ["Bek","Sardor","Madina","Jasur","Zarina","Omina","Ilyos","Bobur","Nilufar","Diyor","Shahzod","Malika","Aziz","Laylo","Temur","Sevara","Javohir","Kamola","Otabek"];
const DAILY_CAP = 150;

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = (a) => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const norm = (s) => String(s).toLowerCase().replace(/[’‘`ʻʼ]/g,"'").replace(/\s+/g," ").trim();

/* ---------- server ---------- */
const SB_URL = "https://meiokexdxhyjcyfpvjvx.supabase.co", SB_KEY = "sb_publishable_YXhY13kbBK3sv89Y9c1uwg_83HfRqME";
let SES = null; try { SES = JSON.parse(localStorage.getItem("at_session") || "null"); } catch (e) {}
if (!SES || SES.role !== "student") location.replace("./");
async function api(fn, args) {
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, { method: "POST", headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ p_token: SES && SES.token }, args || {})) });
  const t = await r.text(); let d = null; try { d = t ? JSON.parse(t) : null; } catch (e) {}
  if (!r.ok) { if (d && d.message === "AUTH") location.replace("./"); throw new Error((d && d.message) || "HTTP " + r.status); }
  return d;
}
let gold = 0, today = 0, LOADED = false, LOAD_ERR = "";
const MONTHS = ["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
function weekOf(iso) { const d = new Date(iso); const m = new Date(d.getFullYear(), d.getMonth(), d.getDate()); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); const e = new Date(m); e.setDate(e.getDate() + 6);
  return { key: m.getTime(), label: m.getMonth() === e.getMonth() ? `${m.getDate()}–${e.getDate()} ${MONTHS[e.getMonth()]}` : `${m.getDate()}-${MONTHS[m.getMonth()]} – ${e.getDate()}-${MONTHS[e.getMonth()]}` }; }
async function load() {
  try {
    const r = await api("vocab_groups");
    gold = r.gold == null ? 300 : r.gold; today = r.today || 0;
    const groups = (r.groups || []).map((g) => { const at = g.week_start ? g.week_start + "T12:00:00" : g.at, w = weekOf(at);
      return { id: "q" + g.id, wk: w.key, week: w.label, recent: Date.now() - new Date(g.at).getTime() < 31 * 86400e3,
        name: g.kind === "cw" ? `${g.lesson ? g.lesson + "-dars · " : "Sinf ishi · "}${g.title}` : `Uy vazifasi · ${g.title}`, words: g.words }; });
    groups.sort((a, b) => b.wk - a.wk);
    GROUPS = groups;
  } catch (e) { LOAD_ERR = "Internet bilan muammo. Sahifani yangilang."; }
  LOADED = true; render();
}
/* endless play: rounds chain with reshuffled words; gold adds up and is paid when the player stops */
let SESS = null;
function award(n){ const v = Math.max(0, Math.round(n || 0)); if (SESS) SESS.n += v; return v; }
async function finishSession(){
  const s = SESS; SESS = null; if (!s) return;
  try {
    const r = await api("vocab_finish", { p_game: s.k, p_n: s.n });
    if (r && r.gold != null) gold = r.gold; if (r && r.today != null) today = r.today;
    if (s.n > 0) toast(r && r.got ? `+${r.got} oltin hisobingizga qo'shildi` : r && r.reason === "TOO_FAST" ? "O'yin juda qisqa edi, oltin berilmadi" : today >= DAILY_CAP ? "Bugungi oltin limiti tugadi" : "Bu safar oltin yo'q");
    render();
  } catch (e) {}
}
window.addEventListener("pagehide", () => {
  if (!SESS || SESS.n <= 0) return;
  try { fetch(`${SB_URL}/rest/v1/rpc/vocab_finish`, { method: "POST", keepalive: true, headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ p_token: SES.token, p_game: SESS.k, p_n: SESS.n }) }); } catch (e) {}
  SESS = null;
});
function nextRound(prev){
  if (G !== prev) return;
  stopLoops();
  const k = prev.k; G = MAKE[k](); G.endless = true; G.round = (prev.round || 1) + 1;
  if (SESS) SESS.rounds += 1;
  if (k === "fall") { G.mode = prev.mode; G.lives = prev.lives; }
  if (k === "boss") { G.hp = prev.hp; }
  render(); window.scrollTo(0, 0);
}
const SV = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const IC = {

  balloon:SV('<ellipse cx="12" cy="9" rx="6" ry="7"/><path d="M12 16v6"/>'),
  wordle:SV('<rect x="3" y="3" width="5" height="5" rx="1"/><rect x="10" y="3" width="5" height="5" rx="1"/><rect x="17" y="3" width="4" height="5" rx="1"/><rect x="3" y="10" width="5" height="5" rx="1"/><rect x="10" y="10" width="5" height="5" rx="1"/>'),
  letters:SV('<path d="M4 18L8 6l4 12M5.5 14h5M14 6h4a3 3 0 0 1 0 6h-4zm0 6h5a3 3 0 0 1 0 6h-5z"/>'),
  memory:SV('<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><path d="M15 15h4v4h-4z"/>'),
  boss:SV('<path d="M3 21V9h3v2h3V9h6v2h3V9h3v12z"/><path d="M10 21v-4a2 2 0 0 1 4 0v4"/>'),
  duel:SV('<path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M9.5 17.5L21 6V3h-3L6.5 14.5M11 19l-6-6M8 16l-4 4M5 21l-2-2"/>'),
  class:SV('<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 4a4 4 0 0 1 0 8M22 21a6 6 0 0 0-4-5.7"/>'),
};
const GAMES = [
  {k:"match",  solo:1, t:"Juftlik",            d:"Inglizcha va o'zbekcha juftlarni tez toping", ic:"match",   c:"--hw", from:"Quizlet Match, Duolingo"},
  {k:"fall",   solo:1, t:"Tushayotgan so'zlar", d:"So'zlar turli joydan, turli yo'l bilan tushadi. Yerga tushmasdan yozing",  ic:"fall",    c:"--cw", from:"Quizlet Gravity"},

let V = {screen:"groups", tab:"week"}, GRP = null, G = null;
const loops = [];
function stopLoops(){ while (loops.length) { const l = loops.pop(); clearInterval(l); cancelAnimationFrame(l); clearTimeout(l); } }
function words(){ if (GRP.words) return GRP.words; const pool = GROUPS.filter(g=>g.recent).flatMap(g=>g.words); const uniq = [...new Map(pool.map(w=>[w[0].toLowerCase(), w])).values()]; return shuffle(uniq).slice(0, 12); }
function wrongs(w, list, n){ return pick(list.filter(x=>x[0]!==w[0]), n); }

/* ---------- screens ---------- */
function goldChip(){ return `<span class="gold"><span class="coin"></span><span id="goldN">${gold}</span></span>`; }

function vGames(){

    ${ws ? `<div class="wlist">${ws.map(w=>`<span class="wchip"><b>${esc(w[0])}</b> · ${esc(w[1])}</span>`).join("")}</div>` : `<p class="sub" style="margin:0">Har o'yinda oxirgi oydagi so'zlardan yangi aralash to'plam chiqadi.</p>`}
    <h2>Yakka o'yinlar</h2><div class="ggrid">${GAMES.filter(g=>g.solo).map(card).join("")}</div>
    <h2>Boshqalar bilan</h2><div class="ggrid">${GAMES.filter(g=>!g.solo).map(card).join("")}</div>
    <p class="small sub">Oltin faqat to'g'ri javob uchun beriladi: bir o'yinda 25 tagacha, kuniga ${DAILY_CAP} tagacha. Bugun: ${today}/${DAILY_CAP}.</p>`;
}
function gameTop(title, right){
  const rnd = G && G.endless && G.round > 1 ? `<span class="pill" style="background:var(--hw-s);color:var(--hw)">${G.round}-raund</span>` : "";
  return `<div class="top"><button class="btn soft sm" data-act="quit" aria-label="O'yindan chiqish">${IC.back.replace('<svg','<svg width="18" height="18"')}</button><h3 class="grow">${esc(title)}</h3>${rnd}${right||""}${goldChip()}</div>`;
}
function vEnd(msg, got){
  const over = !G.endless || (G.k === "fall" && G.lives <= 0) || (G.k === "boss" && G.hp <= 0);
  if (!over) {
    if (!G.nextT) { const prev = G; G.nextT = setTimeout(() => nextRound(prev), 1700); }
    return `<div class="card" style="align-items:center;text-align:center;padding:24px 16px">
      <p class="sub" style="margin:0">${G.round || 1}-raund tugadi</p><div style="font-size:36px;font-weight:800">${esc(msg)}</div>
      <p class="sub" style="margin:0">${got ? `+${got} oltin` : ""}${SESS ? ` · bu o'yinda jami ${SESS.n}` : ""}</p>
      <p style="margin:0;font-weight:600">So'zlar aralashtirilib, keyingi raund boshlanmoqda…</p>
      <button class="btn soft" data-act="stop">To'xtatish</button></div>`;
  }
  const rounds = SESS ? SESS.rounds : (G.round || 1), total = SESS ? SESS.n : (got || 0);
  if (!G.closed) { G.closed = true; if (SESS) setTimeout(finishSession, 0); }
  return `<div class="card" style="align-items:center;text-align:center;padding:28px 16px">
    <div style="font-size:40px;font-weight:800">${esc(G.k === "fall" ? "Jonlar tugadi" : G.k === "boss" ? "Qal'a yiqildi" : msg)}</div>
    <p class="sub" style="margin:0">${rounds} raund · ${esc(msg)} · ${total} oltin (kuniga ${DAILY_CAP} tagacha)</p>
    <div class="row" style="justify-content:center"><button class="btn" data-act="play" data-v="${G.k}">Yana o'ynash</button><button class="btn soft" data-act="games">Boshqa o'yin</button></div></div>`;
}
function render(){
  let h;
  if (V.screen === "groups") h = vGroups();
  else if (V.screen === "games") h = vGames();
  else h = G && G.render ? G.render() : "";
  $("#app").innerHTML = h;
  if (G && G.after) G.after();
}

/* ---------- games ---------- */
const MAKE = {};
// 1. Juftlik
MAKE.match = () => {
  const ws = pick(words(), 6), L = shuffle(ws.map(w=>({w, s:"en"}))), R = shuffle(ws.map(w=>({w, s:"uz"})));
  const g = {k:"match", t0:Date.now(), sel:null, done:new Set(), bad:null, mist:0};
  g.render = () => {
    if (g.done.size === 6) return gameTop("Juftlik") + vEnd(`${Math.round((g.end-g.t0)/100)/10} soniya`, g.got);
    const cell = (x) => { const id = x.s + x.w[0]; const isDone = g.done.has(x.w[0]);
      return `<button class="opt ${isDone?"gone":""} ${g.sel===id?"sel":""} ${g.bad===id?"no shake":""}" data-act="m" data-v="${esc(id)}">${esc(x.s==="en"?x.w[0]:x.w[1])}</button>`; };
    return gameTop("Juftlik", `<span class="pill">${g.done.size}/6</span>`) + `<p class="sub small" style="margin:0;text-align:center">Chapdan inglizcha, o'ngdan o'zbekcha ma'nosini bosing</p>
      <div class="opts">${L.map((x,i)=>cell(x)+cell(R[i])).join("")}</div>`;
  };
  g.act = (v) => {
    if (!g.sel) { g.sel = v; g.bad = null; render(); return; }
    if (g.sel === v) { g.sel = null; render(); return; }
    const a = g.sel, b = v;
    if (a[0] === b[0] && a.slice(0,2) === b.slice(0,2)) { g.sel = v; render(); return; }
    const wa = a.slice(2), wb = b.slice(2);
    if (wa === wb) { g.done.add(wa); g.sel = null; if (g.done.size === 6) { g.end = Date.now(); g.got = award(g.mist ? 4 : 6); } }
    else { g.bad = b; g.sel = null; g.mist++; }
    render();
  };
  return g;
};
// 2. Tushayotgan so'zlar: several words at once, each from its own point and path
MAKE.fall = () => {
  const ws = shuffle(words()).slice(0, 12);
  const g = {k:"fall", next:0, live:[], lives:3, score:0, missed:0, msg:"", ok:false, t:0, lastSpawn:-9, nid:0, mode:null};
  // difficulty: speed (px/s), speed-up per right answer, words on screen at once, seconds between words, gold multiplier
  const MODES = {
    easy:   {n:"Oson",  d:"Sekin tushadi, ekranda ko'pi bilan 2 ta so'z", vy:14, up:0.8, max:2, gap:[4.2, 3.0], gold:1},
    medium: {n:"O'rta", d:"O'rtacha tezlik, ekranda ko'pi bilan 3 ta so'z", vy:21, up:1.5, max:3, gap:[3.4, 2.0], gold:1.5},
    hard:   {n:"Qiyin", d:"Tez tushadi, ekranda 4 tagacha so'z", vy:30, up:2.2, max:4, gap:[2.6, 1.2], gold:2},
  };
  const W = () => { const el = $("#arena"); return el ? el.clientWidth : 340; };
  const spawn = () => {
    if (g.next >= ws.length) return;
    const w = W(), kind = ["straight","diagonal","zigzag","curve"][Math.floor(Math.random()*4)];
    g.live.push({id:g.nid++, w:ws[g.next++], kind, x0: 30 + Math.random()*(w-140), y:-30, vx:(Math.random()<.5?-1:1)*(20+Math.random()*35),
      vy: MODES[g.mode].vy + g.score*MODES[g.mode].up + Math.random()*(MODES[g.mode].vy/2), amp: 30 + Math.random()*40, ph: Math.random()*6, born:g.t});
  };
  const xOf = (o) => { const age = g.t - o.born, w = W();
    let x = o.x0;
    if (o.kind === "diagonal") x = o.x0 + o.vx*age;
    if (o.kind === "zigzag") { const span = w-120; const raw = o.x0 + Math.abs(o.vx)*1.4*age; const m = raw % (2*span); x = 10 + (m < span ? m : 2*span - m); }
    if (o.kind === "curve") x = o.x0 + Math.sin(age*1.6 + o.ph)*o.amp;
    return Math.max(4, Math.min(w-110, x)); };
  g.render = () => {
    if (!g.mode) return gameTop("Tushayotgan so'zlar") + `<p class="sub" style="margin:0">Qiyinlikni tanlang. Qiyinroq rejim ko'proq oltin beradi.</p>
      <div class="list">${Object.entries(MODES).map(([k, m]) => `<button class="li" data-act="fmode" data-v="${k}"><span class="grow"><b style="font-weight:600">${m.n}</b><br><span class="small sub">${m.d}</span></span><span class="pill" style="background:var(--wr-s);color:var(--wr)">×${m.gold} oltin</span></button>`).join("")}</div>`;
    const done = g.lives <= 0 || (g.next >= ws.length && !g.live.length);
    if (done) return gameTop("Tushayotgan so'zlar") + vEnd(`${g.score} / ${ws.length}`, g.got);
    return gameTop("Tushayotgan so'zlar", `<span class="pill">${MODES[g.mode].n}</span><span class="pill">${"❤".repeat(g.lives)}</span><span class="pill">${g.score}</span>`) + `
      <div class="arena" id="arena" aria-live="polite">${g.live.map(o=>`<div class="fall" data-id="${o.id}" style="left:${xOf(o)}px;top:${o.y}px;transform:none">${esc(o.w[1])}</div>`).join("")}<div class="ground"></div></div>
      <div class="fbk" style="color:${g.ok?"var(--rv)":"var(--warn)"}">${esc(g.msg)}</div>
      <input class="big" id="fin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Inglizchasini yozing…" aria-label="Inglizcha so'z">`;
  };
  const finish = () => { if (g.lives <= 0 || (g.next >= ws.length && !g.live.length)) { stopLoops(); g.got = award(Math.round(g.score * MODES[g.mode].gold)); render(); return true; } return false; };
  const tryHit = (val) => {
    const o = g.live.find(x => norm(x.w[0]) === norm(val)); if (!o) return false;
    g.live = g.live.filter(x => x !== o); g.score++; g.ok = true; g.msg = `To'g'ri: ${o.w[0]}`;
    const inp = $("#fin"); if (inp) inp.value = "";
    if (!finish()) { const el = document.querySelector(`.fall[data-id="${o.id}"]`); if (el) el.remove(); const f = document.querySelector(".fbk"); if (f) { f.textContent = g.msg; f.style.color = "var(--rv)"; } const sc = document.querySelectorAll(".top .pill")[2]; if (sc) sc.textContent = g.score; }
    return true;
  };
  g.act = (a, v) => { if (a === "fmode" && !g.mode) { g.mode = v; render(); } };
  g.after = () => {
    const inp = $("#fin"); if (!inp || !g.mode) return;
    inp.focus();
    inp.oninput = () => tryHit(inp.value);
    inp.onkeydown = (e) => { if (e.key === "Enter" && inp.value.trim() && !tryHit(inp.value)) { inp.classList.add("shake"); setTimeout(()=>inp.classList.remove("shake"),300); inp.value = ""; } };
    if (!loops.length) {
      let last = performance.now();
      const step = (now) => {
        const dt = Math.min(0.05, (now - last)/1000); last = now; g.t += dt;
        const M = MODES[g.mode], gap = Math.max(M.gap[1], M.gap[0] - g.score*0.1);
        if ((g.t - g.lastSpawn > gap && g.live.length < M.max) || !g.live.length) { spawn(); g.lastSpawn = g.t; }
        let lost = false;
        g.live.forEach(o => { o.y += o.vy*dt; });
        const fallen = g.live.filter(o => o.y > 300);
        if (fallen.length) { g.live = g.live.filter(o => o.y <= 300); g.lives -= fallen.length; g.missed += fallen.length; g.ok = false; g.msg = `Tushib ketdi: ${fallen.map(o=>o.w[0]).join(", ")}`; lost = true; }
        if (finish()) return;
        if (lost) { const v = ($("#fin")||{}).value || ""; render(); const i2 = $("#fin"); if (i2) { i2.value = v; } }
        else {
          const arena = $("#arena");
          g.live.forEach(o => { let el = arena && arena.querySelector(`.fall[data-id="${o.id}"]`);
            if (!el && arena) { el = document.createElement("div"); el.className = "fall"; el.dataset.id = o.id; el.style.transform = "none"; el.textContent = o.w[1]; arena.insertBefore(el, arena.lastElementChild); }
            if (el) { el.style.top = o.y + "px"; el.style.left = xOf(o) + "px"; } });
        }
        loops[0] = requestAnimationFrame(step);
      };
      loops.push(requestAnimationFrame(step));
    }
  };
  return g;
};
// 3. Tezkor savol (also used by duel and class game)
function quizRound(list, i){
  const w = list[i], dir = Math.random() < .5 ? "en" : "uz";
  const opts = shuffle([w].concat(wrongs(w, GROUPS.flatMap(x=>x.words), 3)));
  return {w, dir, q: dir === "en" ? w[0] : w[1], opts: opts.map(o => dir === "en" ? o[1] : o[0]), right: dir === "en" ? w[1] : w[0]};
}
MAKE.speed = () => {
  const ws = shuffle(words()).slice(0, 10);
  const g = {k:"speed", i:0, pts:0, streak:0, ok:0, ans:null, t0:0, left:1, r:quizRound(ws,0)};
  const LIM = 8000;
  g.render = () => {
    if (g.i >= ws.length) return gameTop("Tezkor savol") + vEnd(`${g.pts} ochko`, g.got);
    const r = g.r;
    return gameTop("Tezkor savol", `<span class="pill">${g.i+1}/10 · ${g.pts}</span>`) + `
      <div class="prog" style="--accent:var(--tr)"><i id="tbar" style="width:${g.left*100}%"></i></div>
      ${g.streak >= 2 ? `<div class="fbk" style="color:var(--wr)">${g.streak} ketma-ket!</div>` : `<div class="fbk"></div>`}
      <div class="q">${esc(r.q)}</div>
      <div class="opts">${r.opts.map((o,j)=>`<button class="opt ${g.ans!=null ? (o===r.right?"ok":j===g.ans?"no":"") : ""}" data-act="sq" data-v="${j}" ${g.ans!=null?"disabled":""}>${esc(o)}</button>`).join("")}</div>`;
  };
  const go = () => { g.i++; g.ans = null; if (g.i < ws.length) { g.r = quizRound(ws, g.i); start(); } else g.got = award(g.ok); render(); };
  const start = () => { stopLoops(); g.t0 = Date.now(); g.left = 1;
    loops.push(setInterval(() => { g.left = Math.max(0, 1 - (Date.now()-g.t0)/LIM); const b = $("#tbar"); if (b) b.style.width = g.left*100 + "%";
      if (g.left <= 0 && g.ans == null) { g.ans = -1; g.streak = 0; render(); stopLoops(); setTimeout(go, 900); } }, 80)); };
  g.act = (v) => {
    if (g.ans != null) return; g.ans = Number(v); stopLoops();
    if (g.r.opts[g.ans] === g.r.right) { g.ok++; g.streak++; g.pts += 50 + Math.round(g.left*50) + Math.min(g.streak,5)*10; } else g.streak = 0;
    render(); setTimeout(go, 800);
  };
  start();
  return g;
};
// 4. Kartochkalar
MAKE.cards = () => {
  const g = {k:"cards", q:shuffle(words()), known:0, flip:false, seen:0};
  const total = g.q.length;
  g.render = () => {
    if (!g.q.length) return gameTop("Kartochkalar") + vEnd(`${total} ta so'z`, g.got);
    const w = g.q[0];
    return gameTop("Kartochkalar", `<span class="pill">Bilaman: ${g.known}/${total}</span>`) + `
      <div class="flash ${g.flip?"on":""}" data-act="flip" role="button" tabindex="0" aria-label="Kartani aylantirish"><div class="in"><div class="f">${esc(w[0])}</div><div class="f b">${esc(w[1])}</div></div></div>
      <p class="sub small" style="text-align:center;margin:0">${g.flip ? "O'zingizni tekshiring" : "Ma'nosini eslang, keyin kartani bosing"}</p>
      <div class="opts"><button class="btn" style="--accent:var(--warn)" data-act="cno" ${g.flip?"":"disabled"}>Bilmayman</button><button class="btn" style="--accent:var(--rv)" data-act="cyes" ${g.flip?"":"disabled"}>Bilaman</button></div>
      <p class="small sub" style="text-align:center;margin:0">Bilmagan so'z 3 kartadan keyin yana chiqadi.</p>`;
  };
  g.act = (a) => {
    if (a === "flip") { g.flip = !g.flip; render(); return; }
    const w = g.q.shift(); g.flip = false;
    if (a === "cyes") { g.known++; } else g.q.splice(Math.min(3, g.q.length), 0, w);
    if (!g.q.length) g.got = award(Math.round(total/2));
    render();
  };
  return g;
};
// 5. Sharlar (hangman, friendly)
MAKE.balloon = () => {
  const list = words().filter(w=>/^[a-z]+$/.test(w[0]));
  const g = {k:"balloon", w:list[Math.floor(Math.random()*list.length)], tried:new Set(), miss:0};
  const COLORS = ["#FF5C8A","#5856D6","#0A84C6","#1C8C4C","#F5B400","#C26A00"];
  g.render = () => {
    const word = g.w[0], win = [...word].every(c=>g.tried.has(c)), lose = g.miss >= 6;
    if (win || lose) return gameTop("Sharlar") + `<div class="q">${esc(word)}</div>` + vEnd(win ? "Topdingiz!" : "Sharlar tugadi", g.got);
    return gameTop("Sharlar", `<span class="pill">${6-g.miss} ta shar</span>`) + `
      <div class="balloons">${COLORS.map((c,i)=>`<span class="bl ${i<g.miss?"pop":""}" style="background:${c}"></span>`).join("")}</div>
      <p class="sub" style="text-align:center;margin:6px 0 0">Ma'nosi: <b style="color:var(--ink)">${esc(g.w[1])}</b></p>
      <div class="slots">${[...word].map(c=>`<span class="slot">${g.tried.has(c)?c:""}</span>`).join("")}</div>
      <div class="kb">${["qwertyuiop","asdfghjkl","zxcvbnm"].map(r=>`<div class="r">${[...r].map(c=>`<button data-act="bk" data-v="${c}" class="${g.tried.has(c)?(word.includes(c)?"g":"x"):""}" ${g.tried.has(c)?"disabled":""}>${c}</button>`).join("")}</div>`).join("")}</div>`;
  };
  g.act = (c) => { if (g.tried.has(c)) return; g.tried.add(c); if (!g.w[0].includes(c)) g.miss++;
    const win = [...g.w[0]].every(x=>g.tried.has(x)); if (win) g.got = award(Math.max(1, 6 - g.miss)); render(); };
  return g;
};
// 6. So'z topish (Wordle-style)
MAKE.wordle = () => {
  let list = words().filter(w=>/^[a-z]{4,6}$/.test(w[0])); if (!list.length) list = GROUPS[1].words.filter(w=>/^[a-z]{4,6}$/.test(w[0]));
  const g = {k:"wordle", w:list[Math.floor(Math.random()*list.length)], rows:[], cur:"", keys:{}};
  const N = g.w[0].length;
  const score = (guess) => { const t = [...g.w[0]], res = Array(N).fill("x"), left = {};
    t.forEach((c,i)=>{ if (guess[i]===c) res[i]="g"; else left[c]=(left[c]||0)+1; });
    [...guess].forEach((c,i)=>{ if (res[i]!=="g" && left[c]) { res[i]="y"; left[c]--; } }); return res; };
  try { g.intro = !localStorage.getItem("wordle_seen"); } catch (e) { g.intro = true; }
  g.render = () => {
    if (g.intro) return gameTop("So'z topish") + `<div class="card"><h3>Qanday o'ynaladi?</h3>
      <p style="margin:0">Yashirin inglizcha so'zni 6 urinishda toping. Tepada o'zbekcha ma'nosi yozilgan, kataklar soni = harflar soni.</p>
      <p style="margin:0">Har urinishdan keyin harflar rangga bo'yaladi:</p>
      <div class="wd"><div class="r">${[["F","x"],["A","x"],["T","g"],["H","g"],["E","g"],["R","g"]].map(([c,k])=>`<span class="c ${k}">${c}</span>`).join("")}</div><div class="r">${[..."MOTHER"].map(c=>`<span class="c g">${c}</span>`).join("")}</div></div>
      <p style="margin:0"><b style="color:#3CB46E">Yashil</b> = harf to'g'ri joyda. <b style="color:#E6B325">Sariq</b> = harf so'zda bor, lekin boshqa joyda. <b style="color:#8E8E93">Kulrang</b> = bu harf so'zda yo'q.</p>
      <p class="sub small" style="margin:0">Misol: so'z MOTHER (ona). FATHER yozsangiz T H E R yashil bo'ladi, demak so'z ...THER bilan tugaydi.</p>
      <button class="btn" data-act="wstart">Tushundim, boshlash</button></div>`;
    const win = g.rows.some(r=>r.word===g.w[0]), lose = !win && g.rows.length >= 6;

    if (a === "kjoin") {
      const c = ($("#kcode").value || "").trim(); if (!/^\d{4}$/.test(c)) { toast("4 xonali kod kiriting"); return; }
      try { const r = await api("vg_join", { p_code: c }); if (r.error) { toast("Bunday o'yin topilmadi"); return; } g.id = r.id; g.stage = "live"; render(); poll(); loops.push(setInterval(poll, 1000)); } catch (e) { toast("Internet bilan muammo"); }
      return;
    }
    if (a === "kq") {
      if (g.busy || !g.st || !g.st.q) return; g.busy = true;
      try { const r = await api("vg_answer", { p_id: g.id, p_qi: g.st.qi, p_choice: g.st.q.opts[Number(v)] }); if (!r.error) { g.res = r; g.st.q = null; } } catch (e) { toast("Internet bilan muammo"); }
      g.busy = false; render();
    }
  };
  return g;
};

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === "home") { finishSession(); stopLoops(); G = null; V.screen = "groups"; render(); window.scrollTo(0,0); return; }
  if (a === "group") { GRP = v === "rand" ? RANDOM : GROUPS.find(g=>g.id===v); V.screen = "games"; render(); window.scrollTo(0,0); return; }
  if (a === "games" || a === "quit" || a === "stop") { finishSession(); stopLoops(); G = null; V.screen = "games"; render(); window.scrollTo(0,0); return; }
  if (a === "play") {
    stopLoops();
    const solo = (GAMES.find((x) => x.k === v) || {}).solo;
    G = MAKE[v](); V.screen = "game";
    const startNew = () => { if (solo) { G.endless = true; G.round = 1; SESS = { k: v, n: 0, rounds: 1 }; api("vocab_start", { p_game: v }).catch(() => {}); } };
    if (SESS) { const g0 = G; finishSession().then(() => { if (G === g0) { startNew(); render(); } }); } else startNew();
    render(); window.scrollTo(0,0); return;
  }
  if (!G) return;
  if (a === "wstart") G.act("wstart");
  else if (["m","sq","mm","bq","bk","wk"].includes(a)) G.act(v);
  else G.act(a, v);
});
document.addEventListener("keydown", (e) => {
  if (G && G.key && V.screen === "game") G.key(e);
  const f = e.target.closest && e.target.closest(".flash"); if (f && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); G.act("flip"); }
});
render(); load();
})();
</script>
